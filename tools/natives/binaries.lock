# Pinned native runtime for the bundled PDAL distribution.
#
# All packages come from conda-forge and are resolved deterministically by
# tools/natives/refresh-lock-closure.sh. Do not edit extra_* entries by hand.
#
# Lock layout per classifier:
# - url/sha256/archive/strip_prefix: pinned root package (libpdal-core)
# - entry_library: PDAL shared library loaded by the Java runtime
# - preload_libraries: libraries loaded before the entry library
# - plugin_path: directory PDAL scans for optional stage plugins
# - closure_roots: extra seed packages for the resolver (runtime data)
# - extra_url_<n>/sha256/archive/strip_prefix: resolver-managed transitive closure
#
# The FFI shim (libpdal_ffi) is compiled per platform by tools/ffi/build-ffi.sh
# and is not part of the lock file.

