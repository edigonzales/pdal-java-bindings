name: Build Natives

on:
  workflow_dispatch:
    inputs:
      verify-lock-closure:
        description: "Run resolver drift check (tools/natives/refresh-lock-closure.sh --check)"
        required: false
        type: boolean
        default: false

jobs:
  build-natives:
    strategy:
      fail-fast: false
      matrix:
        include:
          - classifier: linux-x86_64
            os: ubuntu-24.04
          - classifier: linux-aarch64
            os: ubuntu-24.04-arm
          - classifier: osx-x86_64
            os: macos-15-intel
          - classifier: osx-aarch64
            os: macos-15
          - classifier: windows-x86_64
            os: windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Install conda-package-handling
        shell: bash
        run: |
          python -m pip install --user conda-package-handling
          USER_BASE="$(python -m site --user-base)"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            echo "$USER_BASE/Scripts" >> "$GITHUB_PATH"
          else
            echo "$USER_BASE/bin" >> "$GITHUB_PATH"
          fi

      - name: Make scripts executable
        shell: bash
        run: chmod +x ./gradlew tools/natives/*.sh tools/ffi/*.sh

      - name: Validate lock file
        shell: bash
        run: tools/natives/verify-lock.sh

      - name: Validate lock closure
        if: ${{ inputs.verify-lock-closure }}
        shell: bash
        run: tools/natives/refresh-lock-closure.sh --check

      - name: Install patchelf (Linux only)
        if: startsWith(matrix.classifier, 'linux-')
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf

      - name: Stage native payload (includes C ABI shim build)
        shell: bash
        run: tools/natives/fetch-and-stage.sh ${{ matrix.classifier }}

      - name: Audit runtime dependencies
        shell: bash
        run: tools/natives/audit-runtime-deps.sh ${{ matrix.classifier }}

      - name: Assemble natives jars
        shell: bash
        run: ./gradlew :pdal-ffm-natives:assemble

      - name: Run packaged smoke (twice, shared extraction cache)
        shell: bash
        run: |
          set -euo pipefail
          matches=()
          while IFS= read -r path; do
            [[ -n "$path" ]] && matches+=("$path")
          done < <(
            find pdal-ffm-natives/build/libs -maxdepth 1 -type f \
              -name "pdal-ffm-natives-*-natives-${{ matrix.classifier }}.jar" \
              | sort
          )
          if [[ ${#matches[@]} -ne 1 ]]; then
            echo "Expected exactly one native jar for classifier ${{ matrix.classifier }}, found ${#matches[@]}" >&2
            printf '%s\n' "${matches[@]}" >&2 || true
            exit 1
          fi
          jar_path="$(pwd)/${matches[0]}"
          shared_tmpdir="$(pwd)/pdal-ffm-core/build/tmp/smoke/${{ matrix.classifier }}-shared"
          for run_label in first second; do
            ./gradlew :pdal-ffm-core:smokeTestPackagedNative \
              -PpdalFfmSmokeNativeJar="$jar_path" \
              -PpdalFfmSmokeLabel="${{ matrix.classifier }}-${run_label}" \
              -PpdalFfmSmokeTmpDir="$shared_tmpdir"
          done

      - name: Dump Windows smoke diagnostics on failure
        if: failure() && matrix.classifier == 'windows-x86_64'
        shell: bash
        run: |
          set +e
          echo "=== Windows packaged smoke diagnostics ==="
          dump_tool=""
          if command -v dumpbin >/dev/null 2>&1; then
            dump_tool="dumpbin"
          elif command -v llvm-objdump >/dev/null 2>&1; then
            dump_tool="llvm-objdump"
          fi

          jar_path="$(find pdal-ffm-natives/build/libs -maxdepth 1 -type f -name "pdal-ffm-natives-*-natives-${{ matrix.classifier }}.jar" | sort | head -n1)"
          if [[ -n "$jar_path" ]]; then
            echo "--- jar tf ${jar_path}"
            jar tf "$jar_path" || true
          fi

          tmpdir="$(pwd)/pdal-ffm-core/build/tmp/smoke/${{ matrix.classifier }}-shared"
          echo "--- extracted tree under ${tmpdir}"
          find "$tmpdir" -maxdepth 6 -print 2>/dev/null || true

          while IFS= read -r dll_path; do
            [[ -n "$dll_path" ]] || continue
            echo "--- dependency dump for ${dll_path}"
            if [[ "$dump_tool" == "dumpbin" ]]; then
              dumpbin /DEPENDENTS "$dll_path" || true
            elif [[ "$dump_tool" == "llvm-objdump" ]]; then
              llvm-objdump -p "$dll_path" || true
            else
              echo "No dump tool available"
            fi
          done < <(
            find "$tmpdir" \
              \( -path '*/windows-x86_64/bin/pdalcpp.dll' -o -path '*/windows-x86_64/bin/pdal_ffi.dll' \) \
              -type f 2>/dev/null | sort -u
          )

      - name: Upload classifier artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdal-ffm-natives-${{ matrix.classifier }}
          path: pdal-ffm-natives/build/libs/pdal-ffm-natives-*-natives-${{ matrix.classifier }}.jar
